name: Build BoreMat v0.5 APK

on:
  workflow_dispatch:
  push:
    branches: [ boremat-v050-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore known-good v0.4 source
        run: |
          git fetch origin boremat-v040-build:boremat-v040-build
          for p in part_00 part_01_0 part_01_1 part_01_2 part_02_0 part_02_1 part_02_2 part_03; do
            git show boremat-v040-build:boremat040/$p
          done | base64 -d > boremat-v04.zip
          unzip -t boremat-v04.zip
          unzip -o boremat-v04.zip

      - name: Validate transferred patch pieces
        run: |
          test "$(git hash-object boremat050/patch_01)" = "eef68033de4bc82575f498d6f7a44050b8384002"
          test "$(git hash-object boremat050/patch_02)" = "9af15450f5774095d5f62b3ac9e9512d248e6139"
          test "$(git hash-object boremat050/patch_03)" = "14fee5cc6c12fd5c8fa6e60b305befd79826db25"
          test "$(git hash-object boremat050/patch_04)" = "f86881d5385c573c758ed6c6c729f4b63fb433ad"
          head -c 6000 boremat050/patch_05 > /tmp/patch_05_exact
          test "$(git hash-object /tmp/patch_05_exact)" = "ddfb3882fc76e68ba492c3a2530bcee65909779a"
          test "$(git hash-object boremat050/patch_06_exact)" = "9ddf8db9ebfb117da2cf51cc9cc2280d7165e534"

      - name: Repair one-character transfer loss in first patch piece
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys
          bad = pathlib.Path('boremat050/patch_00_exact').read_bytes()
          target = '7d276d3e4739027618c06d3860f9f5eec783da91'
          if len(bad) != 5999:
              raise SystemExit(f'unexpected first chunk length: {len(bad)}')
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          header = b'blob 6000\0'
          for pos in range(len(bad)+1):
              pre, post = bad[:pos], bad[pos:]
              for ch in alphabet:
                  candidate = pre + bytes([ch]) + post
                  if hashlib.sha1(header + candidate).hexdigest() == target:
                      pathlib.Path('/tmp/patch_00_exact').write_bytes(candidate)
                      print('Recovered missing character at position', pos)
                      sys.exit(0)
          raise SystemExit('Could not deterministically recover first chunk')
          PY
          test "$(git hash-object /tmp/patch_00_exact)" = "7d276d3e4739027618c06d3860f9f5eec783da91"

      - name: Rebuild and verify v0.5 patch
        run: |
          {
            cat /tmp/patch_00_exact
            cat boremat050/patch_01
            cat boremat050/patch_02
            cat boremat050/patch_03
            cat boremat050/patch_04
            cat /tmp/patch_05_exact
            cat boremat050/patch_06_exact
          } | base64 -d > BoreMat-v0.5.patch.gz
          echo "3dac7b64aa8baf97c3381acc4eb6b3bce22a518dac5b2f98cc1b2c2ed290097a  BoreMat-v0.5.patch.gz" | sha256sum -c -
          gzip -dc BoreMat-v0.5.patch.gz > BoreMat-v0.5.patch

      - name: Apply v0.5 changes and validate JavaScript
        run: |
          patch -p1 < BoreMat-v0.5.patch
          node --check app/src/main/assets/app.js
          grep -q "versionName '0.5.0'" app/build.gradle
          grep -q "BoreMat/0.5" app/src/main/java/com/live10/app/MainActivity.java

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BoreMat-v0.5-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
