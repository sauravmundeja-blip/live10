name: Build BoreMat APK

on:
  workflow_dispatch:
  push:
    branches: [ boremat-v0.11.1-crashfix ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rebuild BoreMat source bundle
        run: |
          cat sourceparts/part_00 sourceparts/part_01 sourceparts/part_02 sourceparts/part_03 sourceparts/part_04 sourceparts/part_05 sourceparts/part_06 | base64 -d > boremat-source.zip
          unzip -t boremat-source.zip
      - name: Unpack source
        run: unzip -o boremat-source.zip
      - name: Build release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BoreMat-v0.11.1-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
