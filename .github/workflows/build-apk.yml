name: Build BoreMat v0.10 APK

on:
  workflow_dispatch:
  push:
    branches: [ boremat-v010-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore known-good v0.4 source
        run: |
          git fetch origin boremat-v040-build:boremat-v040-build
          for p in part_00 part_01_0 part_01_1 part_01_2 part_02_0 part_02_1 part_02_2 part_03; do
            git show boremat-v040-build:boremat040/$p
          done | base64 -d > boremat-v04.zip
          unzip -t boremat-v04.zip
          unzip -o boremat-v04.zip

      - name: Rebuild verified v0.5 base
        run: |
          test "$(git hash-object boremat050/patch_01)" = "eef68033de4bc82575f498d6f7a44050b8384002"
          test "$(git hash-object boremat050/patch_02)" = "9af15450f5774095d5f62b3ac9e9512d248e6139"
          test "$(git hash-object boremat050/patch_03)" = "14fee5cc6c12fd5c8fa6e60b305befd79826db25"
          test "$(git hash-object boremat050/patch_04)" = "f86881d5385c573c758ed6c6c729f4b63fb433ad"
          head -c 6000 boremat050/patch_05 > /tmp/v05_patch_05
          test "$(git hash-object /tmp/v05_patch_05)" = "ddfb3882fc76e68ba492c3a2530bcee65909779a"
          test "$(git hash-object boremat050/patch_06_exact)" = "9ddf8db9ebfb117da2cf51cc9cc2280d7165e534"
          python3 - <<'PY'
          import hashlib, pathlib, sys
          bad=pathlib.Path('boremat050/patch_00_exact').read_bytes()
          target='7d276d3e4739027618c06d3860f9f5eec783da91'
          alphabet=b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          header=b'blob 6000\0'
          if len(bad)!=5999: raise SystemExit(f'unexpected v0.5 first chunk length {len(bad)}')
          for pos in range(len(bad)+1):
              for ch in alphabet:
                  c=bad[:pos]+bytes([ch])+bad[pos:]
                  if hashlib.sha1(header+c).hexdigest()==target:
                      pathlib.Path('/tmp/v05_patch_00').write_bytes(c)
                      sys.exit(0)
          raise SystemExit('Could not recover verified v0.5 chunk')
          PY
          {
            cat /tmp/v05_patch_00
            cat boremat050/patch_01
            cat boremat050/patch_02
            cat boremat050/patch_03
            cat boremat050/patch_04
            cat /tmp/v05_patch_05
            cat boremat050/patch_06_exact
          } | base64 -d > BoreMat-v0.5.patch.gz
          echo "3dac7b64aa8baf97c3381acc4eb6b3bce22a518dac5b2f98cc1b2c2ed290097a  BoreMat-v0.5.patch.gz" | sha256sum -c -
          gzip -dc BoreMat-v0.5.patch.gz > BoreMat-v0.5.patch
          patch -p1 < BoreMat-v0.5.patch

      - name: Rebuild verified v0.6 base
        run: |
          test "$(git hash-object boremat060/patch_00)" = "5a6e31048a282d8030a54e5c1385e7324b9eb15d"
          test "$(git hash-object boremat060/patch_01)" = "abec3f3c1604451c4dbc934bf5b358f1440792bb"
          test "$(git hash-object boremat060/patch_02)" = "989257e6c2d26e2fa6f45daacc0be96bd4de1095"
          test "$(git hash-object boremat060/patch_03)" = "e9295fd8f7a72fec768e0c3fddf0606414bccd75"
          test "$(git hash-object boremat060/patch_04)" = "5d552a61d75f83323ed30fe605c1e59115dab12d"
          cat boremat060/patch_00 boremat060/patch_01 boremat060/patch_02 boremat060/patch_03 boremat060/patch_04 | base64 -d > BoreMat-v0.6.patch.gz
          echo "6b48bbfafc4cb9cdfdc336350123a5caffe20ff80f979869774e95082726e281  BoreMat-v0.6.patch.gz" | sha256sum -c -
          gzip -dc BoreMat-v0.6.patch.gz > BoreMat-v0.6.patch
          patch -p1 < BoreMat-v0.6.patch

      - name: Verify and apply v0.7 reliability patch
        run: |
          test "$(git hash-object boremat070/patch_00)" = "eccf74c2835e5cae47c83ddcc4faea027fd44407"
          test "$(git hash-object boremat070/patch_01)" = "41c4aadeaac4f4e12304259b3b23d3cb8519c780"
          test "$(git hash-object boremat070/patch_02)" = "508f8a2606f35b59e921104b5aa4a9f38c90c7b8"
          cat boremat070/patch_00 boremat070/patch_01 boremat070/patch_02 | base64 -d > BoreMat-v0.7.patch.gz
          echo "5f541a8b351301dfe4972f78f2e7178cc84b78fc887b352db268bd2d03d6c72e  BoreMat-v0.7.patch.gz" | sha256sum -c -
          gzip -dc BoreMat-v0.7.patch.gz > BoreMat-v0.7.patch
          patch -p1 < BoreMat-v0.7.patch

      - name: Verify and apply final v0.8 Supabase patch
        run: |
          test "$(git hash-object boremat080supa/part_00)" = "aa47c9d05b2188fcd19449f009765462b914faeb"
          test "$(git hash-object boremat080supa/part_01)" = "f2c680f1adec3b05d6403bbead17c946c93eefb4"
          test "$(git hash-object boremat080supa/part_02)" = "07943b257b227821881f7b89fdf31339a160a10a"
          test "$(git hash-object boremat080supa/part_03)" = "253851ce3f00f1c1b84a6b19db9f7f3ed07591a9"
          test "$(git hash-object boremat080supa/part_04)" = "2bb0b75d453d8781a7f35bcdc1385a78184c83ae"
          cat boremat080supa/part_00 boremat080supa/part_01 boremat080supa/part_02 boremat080supa/part_03 boremat080supa/part_04 | base64 -d > BoreMat-v0.8.patch.gz
          echo "543568f42a1d44b9a9c90860c5a48ee01f3207d308fd3f3eaff6d917b6b29e56  BoreMat-v0.8.patch.gz" | sha256sum -c -
          gzip -dc BoreMat-v0.8.patch.gz > BoreMat-v0.8.patch
          patch -p1 < BoreMat-v0.8.patch

      - name: Validate v0.8 source and signing
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/v06-core.js
          node --check app/src/main/assets/v06.js
          node --check app/src/main/assets/v07.js
          node --check app/src/main/assets/v08.js
          grep -q '<script src="v08.js"></script>' app/src/main/assets/index.html
          grep -q "versionName '0.8.0'" app/build.gradle
          grep -q "versionCode 8" app/build.gradle
          grep -q "BoreMat/0.8" app/src/main/java/com/live10/app/MainActivity.java
          grep -q "functions/v1/boremat-rooms" app/src/main/assets/v08.js
          grep -q "sb_publishable_" app/src/main/assets/v08.js
          ! grep -q "ntfy.sh" app/src/main/java/com/live10/app/MainActivity.java
          ! grep -q "DirectoryBridge" app/src/main/java/com/live10/app/MainActivity.java
          test -s app/boremat-test-key.b64
          base64 -d app/boremat-test-key.b64 > app/boremat-test-key.jks
          keytool -list -keystore app/boremat-test-key.jks -storepass boremat-test-2026 -alias boremat-test >/dev/null

      - name: Live Supabase room-registry smoke test
        run: |
          python3 - <<'PY'
          import os,re,json,urllib.request,urllib.error,pathlib
          src=pathlib.Path("app/src/main/assets/v08.js").read_text()
          api=re.search(r"BM_ROOM_API='([^']+)'",src).group(1)
          key=re.search(r"BM_PUBLISHABLE_KEY='([^']+)'",src).group(1)
          code=("QA"+os.environ.get("GITHUB_RUN_ID","1"))[-14:].upper()
          token="ci-"+os.environ.get("GITHUB_RUN_ID","1")+"-"+os.environ.get("GITHUB_RUN_ATTEMPT","1")
          peer="qa-peer-"+code
          def post(payload):
              req=urllib.request.Request(api,data=json.dumps(payload).encode(),method="POST",
                  headers={"Content-Type":"application/json","apikey":key})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: out=json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"HTTP {e.code}: {e.read().decode()}")
              if not out.get("ok"): raise SystemExit(out)
              return out
          post({"action":"register","code":code,"token":token,"peerId":peer,"gameType":"knockout","title":"CI QA","hostName":"CI","isPublic":True,"playerCount":1,"playerNames":["CI"],"status":"lobby","prize":"1"})
          found=post({"action":"find","code":code})["room"]
          assert found and found["peerId"]==peer and found["status"]=="lobby",found
          assert any(r["code"]==code for r in post({"action":"list"})["rooms"])
          post({"action":"heartbeat","code":code,"token":token,"playerCount":2,"playerNames":["CI","Guest"],"status":"playing"})
          found=post({"action":"find","code":code})["room"]
          assert found and found["status"]=="playing" and found["playerCount"]==2,found
          assert all(r["code"]!=code for r in post({"action":"list"})["rooms"])
          post({"action":"close","code":code,"token":token})
          assert post({"action":"find","code":code})["room"] is None
          print("Supabase room registry smoke test passed:",code)
          PY

      - name: Reconstruct and inject exact QA-tested v0.9 runtime
        run: |
          test "$(git hash-object boremat090/runtime00_a)" = "1def15b20658411a4615280e419f44401745a2cd"
          test "$(git hash-object boremat090/runtime00_b)" = "22a566e078e083ac2db7c170374c08888845bce9"
          test "$(git hash-object boremat090/runtime01_a2)" = "d6e5c39af0ebba543e37b16861bf2c5830af1300"
          test "$(git hash-object boremat090/runtime01_b)" = "8467a16c001fc1c47440f8344b473ae532cf1199"
          test "$(git hash-object boremat090/runtime_01)" = "651e48a9ea26bdb3550b41127bf41b427efdef54"
          python3 - <<'PY'
          import base64,hashlib,pathlib
          broken=pathlib.Path('boremat090/runtime01_a1').read_bytes()
          target='b99756a725e85102970ee7f68ebc5bdbd3a0ff3b'
          alphabet=b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          def gitsha(data):
              return hashlib.sha1((f'blob {len(data)}\0').encode()+data).hexdigest()
          if len(broken)!=1499:
              raise SystemExit(f'unexpected runtime01_a1 length {len(broken)}')
          fixed=None
          for pos in range(len(broken)+1):
              pre,post=broken[:pos],broken[pos:]
              for ch in alphabet:
                  cand=pre+bytes([ch])+post
                  if gitsha(cand)==target:
                      fixed=cand
                      print('Recovered exact runtime01_a1 character at',pos)
                      break
              if fixed: break
          if fixed is None:
              raise SystemExit('Could not recover runtime01_a1 exactly')
          pieces=[
              pathlib.Path('boremat090/runtime00_a').read_bytes(),
              pathlib.Path('boremat090/runtime00_b').read_bytes(),
              fixed,
              pathlib.Path('boremat090/runtime01_a2').read_bytes(),
              pathlib.Path('boremat090/runtime01_b').read_bytes(),
              pathlib.Path('boremat090/runtime_01').read_bytes(),
          ]
          b64=b''.join(pieces)
          if len(b64)!=16680:
              raise SystemExit(f'unexpected reconstructed Base64 length {len(b64)}')
          packed=base64.b64decode(b64,validate=True)
          expected='0a2351745415df01fd050aa6123e9f77ef26ea8d34a61e09d1f6a6b53196661b'
          got=hashlib.sha256(packed).hexdigest()
          if got!=expected:
              raise SystemExit(f'v0.9 runtime SHA mismatch {got}')
          pathlib.Path('/tmp/BoreMat-v0.9-runtime.tar.gz').write_bytes(packed)
          print('Verified exact v0.9 runtime SHA',got)
          PY
          tar -xzf /tmp/BoreMat-v0.9-runtime.tar.gz -C app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          if '<script src="v09.js"></script>' not in s:
              s=s.replace('<script src="v08.js"></script>','<script src="v08.js"></script>\n  <script src="v09.js"></script>')
          p.write_text(s)
          p=Path('app/src/main/assets/live10.html')
          s=p.read_text()
          if '<script src="live09.js"></script>' not in s:
              s=s.replace('<script src="live10.js"></script>','<script src="live10.js"></script>\n<script src="live09.js"></script>')
          p.write_text(s)
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 8','versionCode 9').replace("versionName '0.8.0'","versionName '0.9.0'")
          p.write_text(s)
          p=Path('app/src/main/java/com/live10/app/MainActivity.java')
          s=p.read_text().replace('BoreMat/0.8','BoreMat/0.9')
          p.write_text(s)
          PY
          node --check app/src/main/assets/v09.js
          node --check app/src/main/assets/live09.js
          grep -q '<script src="v09.js"></script>' app/src/main/assets/index.html
          grep -q '<script src="live09.js"></script>' app/src/main/assets/live10.html
          grep -q "versionName '0.9.0'" app/build.gradle
          grep -q "versionCode 9" app/build.gradle
          grep -q "BoreMat/0.9" app/src/main/java/com/live10/app/MainActivity.java
          grep -q "Test Wolf without 5 phones" app/src/main/assets/v09.js
          grep -q "Include Doctor" app/src/main/assets/v09.js
          grep -q "Include Police / Detective" app/src/main/assets/v09.js

      - name: Verify and overlay exact v0.10 source
        run: |
          test "$(git hash-object boremat010/part_00)" = "1831ebed724d9f6b880b9ea50cda1ba8cb510ab9"
          test "$(git hash-object boremat010/part_01)" = "f4ecb07659f11f36a359167eb103d1b43937e8cb"
          test "$(git hash-object boremat010/part_02)" = "4448d504e127a63dbdc82bc522ea4dd728bb83b5"
          test "$(git hash-object boremat010/part_03)" = "f97ec775c70cf8da5ff977a5b083d8fdf095cc03"
          test "$(git hash-object boremat010/part_04)" = "e68027d6f0c7941981f89fb0ca4c8b8801bf687e"
          test "$(git hash-object boremat010/part_05)" = "08349316a710d57d55b9dafc62e36ddc07df47bc"
          test "$(git hash-object boremat010/part_06)" = "38535331abbdfe2c2089e1e44ae7b8b8bc2c32a0"
          test "$(git hash-object boremat010/part_07)" = "87915e2103ecd1e9da3f6dcec9e16d9df2acaedb"
          test "$(git hash-object boremat010/part_08)" = "3ce0580a664cf92bcf3b159ece295ac2edd41b4a"
          test "$(git hash-object boremat010/part_09)" = "65a63d08d3997acaff7f86a06d04099c3c746817"
          test "$(git hash-object boremat010/part_10)" = "99e7ad0eb1ff67f69c9d5252be85f2eca3826c76"
          cat boremat010/part_00 boremat010/part_01 boremat010/part_02 boremat010/part_03 boremat010/part_04 boremat010/part_05 boremat010/part_06 boremat010/part_07 boremat010/part_08 boremat010/part_09 boremat010/part_10 | base64 -d > /tmp/BoreMat-v0.10-override.tar.gz
          echo "88d6400055d928dc490eac9ce74df6f4e6c5f0dfda7ae70aea4682aea721e0ed  /tmp/BoreMat-v0.10-override.tar.gz" | sha256sum -c -
          tar -xzf /tmp/BoreMat-v0.10-override.tar.gz
          echo "e788e7e1d2b06eba8c43ebc7a25718f3acf2abbbb315f90baea733254fad7e46  app/src/main/assets/v09.js" | sha256sum -c -
          echo "8e6c4b308d9d93447d18fb0025a858a235a6a52dfecbbc7b4cc070e8d65e7019  app/src/main/java/com/live10/app/MainActivity.java" | sha256sum -c -
          echo "ca74f0a9c72fa77ef1d92094e5e39a81af0e8cfa5c784e42a0acd2de29308721  app/build.gradle" | sha256sum -c -
          node --check app/src/main/assets/v09.js
          grep -q "versionName '0.10.0'" app/build.gradle
          grep -q "versionCode 10" app/build.gradle
          grep -q "BoreMat/0.10" app/src/main/java/com/live10/app/MainActivity.java
          grep -q "ProfileBridge" app/src/main/java/com/live10/app/MainActivity.java
          grep -q "LIVE10_SCHEDULE_URL" app/src/main/assets/v09.js
          grep -q "isStrictTwo09" app/src/main/assets/v09.js
          grep -q "fooledPairs" app/src/main/assets/v09.js
          grep -q "UPI_QR_BITS09" app/src/main/assets/v09.js
          grep -q "headsQuickTest09" app/src/main/assets/v09.js
          test -s app/boremat-test-key.jks
          keytool -list -keystore app/boremat-test-key.jks -storepass boremat-test-2026 -alias boremat-test >/dev/null

      - name: Live LIVE10 schedule smoke test
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,pathlib
          src=pathlib.Path("app/src/main/assets/v08.js").read_text()
          key=re.search(r"BM_PUBLISHABLE_KEY='([^']+)'",src).group(1)
          url='https://uebmnsprvqrsxxabocit.supabase.co/rest/v1/boremat_live_schedule?show_key=eq.live10&select=show_key,title,start_at,status'
          req=urllib.request.Request(url,headers={'apikey':key})
          with urllib.request.urlopen(req,timeout=20) as r: rows=json.loads(r.read().decode())
          assert len(rows)==1 and rows[0]['show_key']=='live10'
          assert rows[0]['status'] in ('off','scheduled','live')
          print('LIVE10 schedule smoke passed:',rows[0]['status'])
          PY

      - name: Package exact v0.10 source snapshot
        run: |
          zip -qr BoreMat-v0.10-source.zip app build.gradle settings.gradle README.md

      - uses: actions/upload-artifact@v4
        with:
          name: BoreMat-v0.10-source
          path: BoreMat-v0.10-source.zip
          if-no-files-found: error

      - name: Build v0.10 APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: BoreMat-v0.10-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
