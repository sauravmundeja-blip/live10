name: Build BoreMat v0.7 APK

on:
  workflow_dispatch:
  push:
    branches: [ boremat-v070-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore known-good v0.4 source
        run: |
          git fetch origin boremat-v040-build:boremat-v040-build
          for p in part_00 part_01_0 part_01_1 part_01_2 part_02_0 part_02_1 part_02_2 part_03; do
            git show boremat-v040-build:boremat040/$p
          done | base64 -d > boremat-v04.zip
          unzip -t boremat-v04.zip
          unzip -o boremat-v04.zip

      - name: Rebuild verified v0.5 base
        run: |
          test "$(git hash-object boremat050/patch_01)" = "eef68033de4bc82575f498d6f7a44050b8384002"
          test "$(git hash-object boremat050/patch_02)" = "9af15450f5774095d5f62b3ac9e9512d248e6139"
          test "$(git hash-object boremat050/patch_03)" = "14fee5cc6c12fd5c8fa6e60b305befd79826db25"
          test "$(git hash-object boremat050/patch_04)" = "f86881d5385c573c758ed6c6c729f4b63fb433ad"
          head -c 6000 boremat050/patch_05 > /tmp/v05_patch_05
          test "$(git hash-object /tmp/v05_patch_05)" = "ddfb3882fc76e68ba492c3a2530bcee65909779a"
          test "$(git hash-object boremat050/patch_06_exact)" = "9ddf8db9ebfb117da2cf51cc9cc2280d7165e534"
          python3 - <<'PY'
          import hashlib, pathlib, sys
          bad=pathlib.Path('boremat050/patch_00_exact').read_bytes()
          target='7d276d3e4739027618c06d3860f9f5eec783da91'
          alphabet=b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          header=b'blob 6000\0'
          if len(bad)!=5999: raise SystemExit(f'unexpected v0.5 first chunk length {len(bad)}')
          for pos in range(len(bad)+1):
              for ch in alphabet:
                  c=bad[:pos]+bytes([ch])+bad[pos:]
                  if hashlib.sha1(header+c).hexdigest()==target:
                      pathlib.Path('/tmp/v05_patch_00').write_bytes(c)
                      sys.exit(0)
          raise SystemExit('Could not recover verified v0.5 chunk')
          PY
          {
            cat /tmp/v05_patch_00
            cat boremat050/patch_01
            cat boremat050/patch_02
            cat boremat050/patch_03
            cat boremat050/patch_04
            cat /tmp/v05_patch_05
            cat boremat050/patch_06_exact
          } | base64 -d > BoreMat-v0.5.patch.gz
          echo "3dac7b64aa8baf97c3381acc4eb6b3bce22a518dac5b2f98cc1b2c2ed290097a  BoreMat-v0.5.patch.gz" | sha256sum -c -
          gzip -dc BoreMat-v0.5.patch.gz > BoreMat-v0.5.patch
          patch -p1 < BoreMat-v0.5.patch

      - name: Rebuild verified v0.6 base
        run: |
          test "$(git hash-object boremat060/patch_00)" = "5a6e31048a282d8030a54e5c1385e7324b9eb15d"
          test "$(git hash-object boremat060/patch_01)" = "abec3f3c1604451c4dbc934bf5b358f1440792bb"
          test "$(git hash-object boremat060/patch_02)" = "989257e6c2d26e2fa6f45daacc0be96bd4de1095"
          test "$(git hash-object boremat060/patch_03)" = "e9295fd8f7a72fec768e0c3fddf0606414bccd75"
          test "$(git hash-object boremat060/patch_04)" = "5d552a61d75f83323ed30fe605c1e59115dab12d"
          cat boremat060/patch_00 boremat060/patch_01 boremat060/patch_02 boremat060/patch_03 boremat060/patch_04 | base64 -d > BoreMat-v0.6.patch.gz
          echo "6b48bbfafc4cb9cdfdc336350123a5caffe20ff80f979869774e95082726e281  BoreMat-v0.6.patch.gz" | sha256sum -c -
          gzip -dc BoreMat-v0.6.patch.gz > BoreMat-v0.6.patch
          patch -p1 < BoreMat-v0.6.patch

      - name: Verify and apply v0.7 reliability patch
        run: |
          test "$(git hash-object boremat070/patch_00)" = "eccf74c2835e5cae47c83ddcc4faea027fd44407"
          test "$(git hash-object boremat070/patch_01)" = "41c4aadeaac4f4e12304259b3b23d3cb8519c780"
          test "$(git hash-object boremat070/patch_02)" = "508f8a2606f35b59e921104b5aa4a9f38c90c7b8"
          cat boremat070/patch_00 boremat070/patch_01 boremat070/patch_02 | base64 -d > BoreMat-v0.7.patch.gz
          echo "5f541a8b351301dfe4972f78f2e7178cc84b78fc887b352db268bd2d03d6c72e  BoreMat-v0.7.patch.gz" | sha256sum -c -
          gzip -dc BoreMat-v0.7.patch.gz > BoreMat-v0.7.patch
          patch -p1 < BoreMat-v0.7.patch

      - name: Validate v0.7 source and signing
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/v06-core.js
          node --check app/src/main/assets/v06.js
          node --check app/src/main/assets/v07.js
          grep -q '<script src="v07.js"></script>' app/src/main/assets/index.html
          grep -q "versionName '0.7.0'" app/build.gradle
          grep -q "versionCode 7" app/build.gradle
          grep -q "BoreMat/0.7" app/src/main/java/com/live10/app/MainActivity.java
          grep -q "Nobody got that one. Round void" app/src/main/assets/v07.js
          grep -q "PRIZE — OPTIONAL" app/src/main/assets/v07.js
          grep -q "boremat-v07-room-" app/src/main/assets/v07.js
          test -s app/boremat-test-key.b64
          base64 -d app/boremat-test-key.b64 > app/boremat-test-key.jks
          keytool -list -keystore app/boremat-test-key.jks -storepass boremat-test-2026 -alias boremat-test >/dev/null

      - name: Build v0.7 APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: BoreMat-v0.7-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
