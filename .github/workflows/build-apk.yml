name: Build BoreMat APK

on:
  workflow_dispatch:
  push:
    branches: [ boremat-v031-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rebuild source bundle
        run: |
          cat boremat031/part_00 boremat031/part_01 boremat031/part_02 | base64 -d > boremat-source.zip
          unzip -t boremat-source.zip
      - name: Unpack source
        run: unzip -o boremat-source.zip
      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BoreMat-v0.3.1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
